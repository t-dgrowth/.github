name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: comportamento
    attributes:
      label: O que aconteceu
      description: Descreva o problema. Não inclua dados de clientes nem credenciais.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Veja o erro...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options:
        - P0 - bloqueia o uso ou envolve segurança
        - P1 - importante, entra no próximo ciclo
        - P2 - pode esperar
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critério de aceite
      description: Como saber que foi corrigido?
    validations:
      required: true
